<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Desire path</title>

  <link rel="stylesheet" href="./style.css">

  <script type="module" src="./src/main.ts"></script>
</head>

<body>
  <main>
    <aside>
      <label class="control">
        Разрешение
        <input id="routeResolution" type="range" min="1" max="20" value="8">
        <output id="routeResolutionValue"></output>
      </label>

      <label class="control">
        Агенты
        <input id="agentCount" type="range" min="0" max="10000" value="1000">
        <output id="agentCountValue"></output>
      </label>

      <label class="control">
        Инерция направления
        <input id="turnSmoothness" type="range" min="0" max="555" value="0.6" step="0.1">
        <output id="turnSmoothnessValue"></output>
      </label>

      <fieldset class="debug-section">
        <legend>Отладка</legend>

        <label>
          <input id="showTerrain" type="checkbox" checked>
          Ландшафт
        </label>

        <label>
          <input id="showDestinations" type="checkbox" checked>
          Пункты назначения
        </label>

        <label>
          <input id="showCoarseMap" type="checkbox">
          Карта проходимости
        </label>

        <fieldset>
          <legend>Карты навигации</legend>

          <label>
            <input id="hideNavigationMap" name="navigationMap" value="none" type="radio" checked>
            скрыть
          </label>

          <label>
            <input name="navigationMap" value=0 type="radio">
            1
          </label>

          <label>
            <input name="navigationMap" value=1 type="radio">
            2
          </label>
        </fieldset>

        <label>
          <input id="showAgents" type="checkbox" checked>
          Агенты
        </label>
      </fieldset>
    </aside>

    <canvas id="simulationCanvas"></canvas>
  </main>
</body>

</html>
